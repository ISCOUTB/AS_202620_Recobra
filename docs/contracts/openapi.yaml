openapi: 3.0.3
info:
  title: Recobra API
  description: >
    Contrato de la API principal de Recobra (corte vertical de publicaciones
    y consulta de coincidencias). Fuente única de verdad para el equipo de
    backend (NestJS) y el cliente Flutter (`mobile/lib/api/recobra_api.dart`).
    Ver ADR-0004 para la justificación de por qué crear/consultar
    publicaciones es síncrono sobre REST, y por qué Emparejamiento se
    dispara de forma asíncrona (evento en proceso) sin exponerse como una
    ruta de escritura.

    Versionado semántico del contrato: 1.0.0 corte vertical; 1.1.0 agrega
    /coincidencias (compatible); 2.0.0 unifica los errores en un solo esquema
    `Error` ({ statusCode, message }) — el 400 antes respondía { error }, así
    que es un cambio incompatible y sube la versión mayor. Los dos
    consumidores (Flutter y la vitrina public/index.html) se actualizaron en
    el mismo commit. 2.1.0 agrega `GET /publicaciones` con filtros (búsqueda
    del escenario S1, ADR-0008): cambio compatible, sube la versión menor.
  version: "2.1.0"
servers:
  - url: https://recobra-backend.onrender.com
    description: Producción (Render, ver ADR-0005)
  - url: http://localhost:3000
    description: Backend local (npm run start)
paths:
  /health:
    get:
      operationId: consultarSalud
      summary: Verificación de proceso vivo
      tags: [Salud]
      responses:
        "200":
          description: El servicio está arriba
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salud"
  /publicaciones:
    get:
      operationId: buscarPublicaciones
      summary: Buscar publicaciones con filtros (escenario S1)
      description: >
        Filtros exactos, sin distinguir mayúsculas ni espacios de borde.
        Devuelve las más recientes primero. `limite` entre 1 y 50 (por
        defecto 20). Ver ADR-0008.
      tags: [Publicaciones]
      parameters:
        - name: tipo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TipoPublicacion"
        - name: categoria
          in: query
          required: false
          schema:
            type: string
        - name: ubicacion
          in: query
          required: false
          schema:
            type: string
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Lista de publicaciones que cumplen los filtros (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Publicacion"
        "400":
          description: Filtro inválido (tipo desconocido o límite fuera de rango)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error interno controlado (p. ej. falla el adaptador de persistencia)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: crearPublicacion
      summary: Crear una publicación (objeto perdido o encontrado)
      tags: [Publicaciones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearPublicacionRequest"
      responses:
        "201":
          description: Publicación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publicacion"
        "400":
          description: Datos de la publicación inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error interno controlado (p. ej. falla el adaptador de persistencia)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publicaciones/{id}:
    get:
      operationId: consultarPublicacion
      summary: Consultar una publicación por id
      tags: [Publicaciones]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Publicación encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publicacion"
        "404":
          description: No existe una publicación con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /coincidencias:
    get:
      operationId: listarCoincidencias
      summary: Consultar coincidencias detectadas para una publicación
      tags: [Emparejamiento]
      parameters:
        - name: publicacionId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Lista de coincidencias (vacía si no hay o si no se envía publicacionId)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coincidencia"
components:
  schemas:
    Salud:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: recobra-backend
    TipoPublicacion:
      type: string
      enum: [perdido, encontrado]
    CrearPublicacionRequest:
      type: object
      required: [tipo, descripcion, categoria, ubicacion]
      properties:
        tipo:
          $ref: "#/components/schemas/TipoPublicacion"
        descripcion:
          type: string
          minLength: 1
        categoria:
          type: string
          minLength: 1
        ubicacion:
          type: string
          minLength: 1
    Publicacion:
      type: object
      required: [id, tipo, descripcion, categoria, ubicacion, estado, creadoEn]
      properties:
        id:
          type: string
        tipo:
          $ref: "#/components/schemas/TipoPublicacion"
        descripcion:
          type: string
        categoria:
          type: string
        ubicacion:
          type: string
        estado:
          type: string
          example: publicado
        creadoEn:
          type: string
          format: date-time
    Error:
      description: Formato único de error para 400, 404 y 500.
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          type: string
          example: "tipo debe ser uno de: perdido, encontrado"
    Coincidencia:
      type: object
      required: [id, publicacionOrigenId, publicacionCoincidenteId, score, estado, creadoEn]
      properties:
        id:
          type: string
        publicacionOrigenId:
          type: string
        publicacionCoincidenteId:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        estado:
          type: string
          enum: [detectada]
        creadoEn:
          type: string
          format: date-time

openapi: 3.0.3
info:
  title: Recobra API
  description: >
    Contrato de la API principal de Recobra (corte vertical de publicaciones
    y consulta de coincidencias). Fuente única de verdad para el equipo de
    backend (NestJS) y el cliente Flutter (`mobile/lib/api/recobra_api.dart`).
    Ver ADR-0004 para la justificación de por qué crear/consultar
    publicaciones es síncrono sobre REST, y por qué Emparejamiento se
    dispara de forma asíncrona (evento en proceso) sin exponerse como una
    ruta de escritura.

    Versionado semántico del contrato: 1.0.0 corte vertical; 1.1.0 agrega
    /coincidencias (compatible); 2.0.0 unifica los errores en un solo esquema
    `Error` ({ statusCode, message }) — el 400 antes respondía { error }, así
    que es un cambio incompatible y sube la versión mayor. Los dos
    consumidores (Flutter y la vitrina public/index.html) se actualizaron en
    el mismo commit. 2.1.0 agrega `GET /publicaciones` con filtros (búsqueda
    del escenario S1, ADR-0008): cambio compatible, sube la versión menor.
    2.2.0 agrega `GET /health/ready` (disponibilidad de datos, distinta de la
    vivacidad del proceso) y la respuesta 503 cuando el almacenamiento no
    responde: cambio compatible.
    2.3.0 agrega la cabecera opcional `Idempotency-Key` en `POST /publicaciones`
    (un reintento con la misma clave responde 200 con la publicación original,
    sin crear otra; con datos distintos responde 422): cambio compatible, los
    clientes que no la envían siguen igual. Ver docs/modos-de-fallo.md.
    3.0.0 agrega cuentas y reclamaciones (ADR-0013, ADR-0014): `POST /cuentas`,
    `POST|DELETE /sesiones`, `GET /cuentas/yo`, `GET /publicaciones/mias`, las
    rutas de reclamaciones, y `Publicacion` con `autorId` y los estados del
    ciclo de vida. Es un cambio **incompatible**: `POST /publicaciones` ahora
    exige `Authorization: Bearer <token>` (401 sin sesión), así que sube la
    versión mayor.
    3.1.0 agrega la bandeja de avisos (`GET /notificaciones`,
    `POST /notificaciones/{id}/leida`, `POST /notificaciones/leidas`, ADR-0015):
    cambio compatible.
    3.2.0 agrega los lugares en dos niveles: `GET /lugares` (catálogo con
    pisos) y el campo opcional `detalleUbicacion` (piso, salón o referencia):
    cambio compatible.
    4.0.0 completa el ciclo de vida (ADR-0017): aprobar deja el objeto en
    `por_entregar` (antes iba directo a `reclamado`), la entrega se confirma
    con `POST /reclamaciones/{id}/entregada`, el autor cierra con
    `POST /publicaciones/{id}/cerrar` y lo que vence pasa a `cerrado`. La
    búsqueda ya no devuelve lo cerrado ni lo entregado. Cambio incompatible:
    versión mayor.
    4.1.0 agrega dónde está un objeto encontrado (`custodia`, `puntoCustodia`,
    `POST /publicaciones/{id}/custodia`) y "Lo tengo yo" sobre un objeto
    perdido (`POST /publicaciones/{id}/lo-tengo`), ADR-0019: cambio compatible.
    5.0.0 agrega la privacidad de los datos (ADR-0021): `POST /cuentas` exige
    `aceptoPrivacidad: true` (cambio incompatible: versión mayor), y se suman
    `GET /privacidad`, `GET /cuentas/yo/datos` y `DELETE /cuentas/yo`.
    `POST /sesiones` responde 429 tras 5 intentos fallidos por correo en 15
    minutos.
    5.1.0 agrega la moderación mínima (ADR-0022): `POST /publicaciones/{id}/reportar`,
    `GET /moderacion/reportes` y `POST /moderacion/reportes/{id}/resolver` (solo
    administradores), el motivo de cierre `moderado`, el aviso
    `publicacion_ocultada` y el campo `esAdministrador` de la cuenta: cambio
    compatible.
    5.2.0 agrega las fotos (ADR-0023): `PUT` y `DELETE /publicaciones/{id}/foto`
    (solo quien publicó), `GET /publicaciones/{id}/foto` (completa; la de un
    objeto encontrado solo la ven su autor y quien tiene una reclamación
    aprobada), `GET /publicaciones/{id}/foto/miniatura` (pública) y el campo
    `tieneFoto` de la publicación: cambio compatible.
  version: "5.2.0"
servers:
  - url: https://recobra.iscoutb.dev
    description: Producción (Dokploy, servidor del laboratorio)
  - url: http://localhost:3000
    description: Backend local (npm run start)
paths:
  /privacidad:
    get:
      operationId: avisoDePrivacidad
      summary: Aviso de privacidad (público, versionado)
      tags: [Privacidad]
      responses:
        "200":
          description: El aviso, en secciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvisoPrivacidad"
  /health:
    get:
      operationId: consultarSalud
      summary: Verificación de proceso vivo
      tags: [Salud]
      responses:
        "200":
          description: El servicio está arriba
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salud"
  /health/ready:
    get:
      operationId: consultarDisponibilidad
      summary: Disponibilidad de datos (el almacenamiento responde)
      description: >
        A diferencia de `/health`, que solo dice que el proceso está vivo,
        este endpoint comprueba que la base de datos contesta. Responde 503
        si no, para que un monitor distinga "proceso vivo" de "puede atender
        publicaciones".
      tags: [Salud]
      responses:
        "200":
          description: El almacenamiento responde
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disponibilidad"
        "503":
          description: El almacenamiento no responde
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Disponibilidad"
  /publicaciones:
    get:
      operationId: buscarPublicaciones
      summary: Buscar publicaciones con filtros (escenario S1)
      description: >
        Filtros exactos, sin distinguir mayúsculas ni espacios de borde.
        Devuelve las más recientes primero. `limite` entre 1 y 50 (por
        defecto 20). Ver ADR-0008.
      tags: [Publicaciones]
      parameters:
        - name: tipo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TipoPublicacion"
        - name: categoria
          in: query
          required: false
          schema:
            type: string
        - name: ubicacion
          in: query
          required: false
          schema:
            type: string
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Lista de publicaciones que cumplen los filtros (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Publicacion"
        "400":
          description: Filtro inválido (tipo desconocido o límite fuera de rango)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error interno controlado (p. ej. falla el adaptador de persistencia)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: El almacenamiento no está disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: crearPublicacion
      summary: Crear una publicación (objeto perdido o encontrado); exige sesión
      tags: [Publicaciones]
      security:
        - sesion: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Clave elegida por el cliente (por ejemplo un UUID) para que un
            reintento de la misma creación no la duplique.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{8,100}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearPublicacionRequest"
      responses:
        "201":
          description: Publicación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publicacion"
        "200":
          description: Reintento con una Idempotency-Key ya usada; devuelve la publicación original sin crear otra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publicacion"
        "400":
          description: Datos de la publicación inválidos o Idempotency-Key con formato inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: La Idempotency-Key ya se usó con datos distintos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Error interno controlado (p. ej. falla el adaptador de persistencia)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: El almacenamiento no está disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publicaciones/{id}/foto:
    put:
      operationId: subirFoto
      summary: Agregar o reemplazar la foto de una publicación propia
      description: >
        El cuerpo es el JPEG (hasta 1 MB y 2048 px por lado). La cabecera
        `X-Miniatura` lleva, en base64, otro JPEG de hasta 32 px por lado y 4 KB:
        es lo único que verá el público de un objeto encontrado. El servidor
        quita de ambos los datos ocultos (EXIF, ubicación GPS, comentarios).
        Solo mientras la publicación está `publicado`.
      tags: [Fotos]
      security:
        - sesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Miniatura
          in: header
          required: true
          schema:
            type: string
            maxLength: 6000
          description: JPEG de hasta 32 px por lado, en base64
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: "Publicación con tieneFoto en true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publicacion"
        "400":
          description: No es un JPEG, falta o es inválida la miniatura, o excede los límites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Solo quien publicó
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La publicación no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Tiene una reclamación en curso o está cerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: La foto pesa más de 1 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: quitarFoto
      summary: Quitar la foto de una publicación propia
      tags: [Fotos]
      security:
        - sesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Publicación con tieneFoto en false"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publicacion"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Solo quien publicó
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La publicación no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Tiene una reclamación en curso o está cerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: verFoto
      summary: Foto completa de una publicación
      description: >
        La de un objeto perdido es pública. La de un objeto encontrado la ven
        solo quien lo publicó y quien lo reclamó cuando su reclamación ya fue
        aprobada (con `Authorization`); los demás reciben 403 y pueden pedir la
        miniatura.
      tags: [Fotos]
      security:
        - {}
        - sesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: La imagen
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "403":
          description: La foto completa de un objeto encontrado no es para esta persona
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La publicación no existe o no tiene foto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publicaciones/{id}/foto/miniatura:
    get:
      operationId: verMiniatura
      summary: Miniatura de la foto de una publicación (pública)
      tags: [Fotos]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Un JPEG de hasta 32 px por lado
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: La publicación no existe o no tiene foto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publicaciones/{id}/custodia:
    post:
      operationId: cambiarCustodia
      summary: Decir dónde está ahora un objeto encontrado (solo quien lo encontró)
      tags: [Publicaciones]
      security:
        - sesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [custodia]
              properties:
                custodia:
                  type: string
                  enum: [quien_lo_encontro, punto_de_entrega]
                puntoCustodia:
                  type: string
                  maxLength: 120
      responses:
        "200":
          description: Publicación actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publicacion"
        "400":
          description: Custodia inválida, falta el punto o no es un objeto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Solo quien encontró el objeto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La publicación no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El objeto ya se entregó o la publicación está cerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publicaciones/{id}/lo-tengo:
    post:
      operationId: reportarHallazgo
      summary: '"Lo tengo yo": crea un encontrado enlazado a este objeto perdido y avisa a su dueño'
      tags: [Emparejamiento]
      security:
        - sesion: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id de la publicación del objeto perdido
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [descripcion, ubicacion]
              properties:
                descripcion:
                  type: string
                  minLength: 1
                  description: Lo que se ve del objeto, sin los detalles que el dueño usará como prueba
                ubicacion:
                  type: string
                  minLength: 1
                detalleUbicacion:
                  type: string
                  maxLength: 120
                custodia:
                  type: string
                  enum: [quien_lo_encontro, punto_de_entrega]
                puntoCustodia:
                  type: string
                  maxLength: 120
      responses:
        "201":
          description: Publicación de encontrado creada (misma categoría que el perdido)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publicacion"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La publicación no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No es un objeto perdido, ya está cerrado o entregado, es tuyo o ya respondiste
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publicaciones/{id}/reportar:
    post:
      operationId: reportarPublicacion
      summary: Reportar una publicación (abuso, spam, datos de terceros…)
      description: Una cuenta reporta una publicación una sola vez; no la propia ni una cerrada.
      tags: [Moderación]
      security:
        - sesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
                  enum: [falso, spam, inapropiado, datos_personales, otro]
                detalle:
                  type: string
                  maxLength: 300
                  description: Obligatorio (mínimo 5 caracteres) con motivo "otro"
      responses:
        "201":
          description: Reporte recibido
          content:
            application/json:
              schema:
                type: object
                required: [id, publicacionId, estado]
                properties:
                  id:
                    type: string
                  publicacionId:
                    type: string
                  estado:
                    type: string
                    enum: [abierto]
        "400":
          description: Motivo inválido o detalle faltante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La publicación no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Es tu publicación, ya está cerrada o ya la reportaste
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /moderacion/reportes:
    get:
      operationId: listarReportesAbiertos
      summary: Reportes abiertos, los más antiguos primero (solo administradores)
      tags: [Moderación]
      security:
        - sesion: []
      responses:
        "200":
          description: Reportes abiertos con un resumen de la publicación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReporteParaModerar"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La cuenta no es administradora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /moderacion/reportes/{id}/resolver:
    post:
      operationId: resolverReporte
      summary: Ocultar la publicación o descartar el reporte (solo administradores)
      tags: [Moderación]
      security:
        - sesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [ocultar, descartar]
                nota:
                  type: string
                  maxLength: 300
      responses:
        "200":
          description: Reporte resuelto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reporte"
        "400":
          description: Decisión inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La cuenta no es administradora
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El reporte no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El reporte ya estaba resuelto o la publicación tiene una reclamación o entrega en curso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publicaciones/{id}/cerrar:
    post:
      operationId: cerrarPublicacion
      summary: Cerrar una publicación propia (recuperado, solo perdidos, o retirado)
      tags: [Publicaciones]
      security:
        - sesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
                  enum: [recuperado, retirado]
      responses:
        "200":
          description: Publicación cerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publicacion"
        "400":
          description: Motivo inválido o "recuperado" en un objeto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Solo quien publicó el objeto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La publicación no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Tiene una reclamación en curso, ya se entregó o ya estaba cerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publicaciones/{id}:
    get:
      operationId: consultarPublicacion
      summary: Consultar una publicación por id
      tags: [Publicaciones]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Publicación encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publicacion"
        "404":
          description: No existe una publicación con ese id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: El almacenamiento no está disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publicaciones/mias:
    get:
      operationId: listarMisPublicaciones
      summary: Publicaciones de la cuenta de la sesión
      tags: [Publicaciones]
      security:
        - sesion: []
      responses:
        "200":
          description: Publicaciones de la cuenta, las más recientes primero
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Publicacion"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /publicaciones/{id}/reclamaciones:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: reclamarPublicacion
      summary: Reclamar un objeto encontrado (escenario S2)
      tags: [Reclamaciones]
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prueba]
              properties:
                prueba:
                  type: string
                  minLength: 20
                  maxLength: 1000
                  description: Algo que solo el dueño sabría del objeto
      responses:
        "201":
          description: Reclamación registrada; el objeto pasa a en_verificacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reclamacion"
        "400":
          description: Prueba insuficiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La publicación no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: No se puede reclamar (no es un objeto encontrado, es propia, ya entregada o hay una pendiente)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listarReclamacionesDePublicacion
      summary: Reclamaciones de una publicación propia
      tags: [Reclamaciones]
      security:
        - sesion: []
      responses:
        "200":
          description: Reclamaciones con su prueba; el correo del reclamante solo si se aprobó
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReclamacionParaAutor"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La publicación no es de esta cuenta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La publicación no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reclamaciones/mias:
    get:
      operationId: listarMisReclamaciones
      summary: Reclamaciones hechas por la cuenta de la sesión
      tags: [Reclamaciones]
      security:
        - sesion: []
      responses:
        "200":
          description: Estado de cada reclamación; el contacto de quien encontró el objeto solo si se aprobó
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReclamacionPropia"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reclamaciones/{id}/entregada:
    post:
      operationId: confirmarEntrega
      summary: Confirmar que el objeto llegó a su dueño (quien reclamó o quien lo encontró); pasa a reclamado
      tags: [Reclamaciones]
      security:
        - sesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entrega confirmada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reclamacion"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Solo quien reclamó o quien encontró el objeto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La reclamación no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La reclamación no está aprobada o la entrega ya se confirmó
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reclamaciones/{id}/aprobar:
    post:
      operationId: aprobarReclamacion
      summary: Aprobar una reclamación (solo quien publicó el objeto); el objeto pasa a por_entregar
      tags: [Reclamaciones]
      security:
        - sesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reclamación aprobada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reclamacion"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Solo quien publicó el objeto puede resolver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La reclamación no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La reclamación ya se resolvió o el estado cambió
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reclamaciones/{id}/rechazar:
    post:
      operationId: rechazarReclamacion
      summary: Rechazar una reclamación con su motivo (solo quien publicó el objeto)
      tags: [Reclamaciones]
      security:
        - sesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
                  minLength: 3
                  maxLength: 300
      responses:
        "200":
          description: Reclamación rechazada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reclamacion"
        "400":
          description: Falta el motivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Solo quien publicó el objeto puede resolver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La reclamación no existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La reclamación ya se resolvió
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cuentas:
    post:
      operationId: registrarCuenta
      summary: Registrar una cuenta con correo institucional (@utb.edu.co)
      tags: [Identidad]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, nombre, contrasena, aceptoPrivacidad]
              properties:
                correo:
                  type: string
                  example: ana.perez@utb.edu.co
                nombre:
                  type: string
                contrasena:
                  type: string
                  minLength: 8
                aceptoPrivacidad:
                  type: boolean
                  enum: [true]
                  description: Autoriza el tratamiento de datos según el aviso de privacidad (`GET /privacidad`)
      responses:
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cuenta"
        "400":
          description: Correo no institucional, nombre o contraseña inválidos, o no se aceptó el aviso de privacidad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cuentas/yo:
    delete:
      operationId: eliminarMiCuenta
      summary: Eliminar la cuenta (derecho de supresión); anonimiza lo que queda
      description: >
        Pide la contraseña. No se puede mientras haya una reclamación pendiente o
        aprobada sin entrega, o un objeto propio con una reclamación o entrega en
        curso. Retira las publicaciones propias que siguen publicadas, borra los
        avisos y las sesiones, reemplaza el texto de las pruebas escritas y quita
        el nombre, el correo y la contraseña (ADR-0021).
      tags: [Privacidad]
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contrasena]
              properties:
                contrasena:
                  type: string
      responses:
        "204":
          description: Cuenta eliminada
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La contraseña no coincide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Hay reclamaciones o entregas en curso que resolver primero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: consultarMiCuenta
      summary: Cuenta de la sesión
      tags: [Identidad]
      security:
        - sesion: []
      responses:
        "200":
          description: Datos de la cuenta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cuenta"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cuentas/yo/datos:
    get:
      operationId: descargarMisDatos
      summary: Todo lo que Recobra guarda de la cuenta (derecho de acceso)
      tags: [Privacidad]
      security:
        - sesion: []
      responses:
        "200":
          description: La cuenta, sus publicaciones, sus reclamaciones (con la prueba que escribió) y sus avisos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatosPersonales"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sesiones:
    post:
      operationId: iniciarSesion
      summary: Iniciar sesión con correo y contraseña
      tags: [Identidad]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, contrasena]
              properties:
                correo:
                  type: string
                contrasena:
                  type: string
      responses:
        "201":
          description: Sesión iniciada; el token se envía después como Authorization Bearer
          content:
            application/json:
              schema:
                type: object
                required: [token, expiraEn, cuenta]
                properties:
                  token:
                    type: string
                  expiraEn:
                    type: string
                    format: date-time
                  cuenta:
                    $ref: "#/components/schemas/Cuenta"
        "401":
          description: Correo o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Demasiados intentos fallidos de inicio de sesión para ese correo (5 en 15 minutos)
          headers:
            Retry-After:
              description: Segundos que hay que esperar
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: cerrarSesion
      summary: Cerrar la sesión actual
      tags: [Identidad]
      security:
        - sesion: []
      responses:
        "204":
          description: Sesión cerrada
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /lugares:
    get:
      operationId: listarLugares
      summary: Catálogo de lugares del campus con sus pisos
      tags: [Publicaciones]
      responses:
        "200":
          description: Lugares en el orden en que se muestran
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LugarCampus"
  /notificaciones:
    get:
      operationId: listarNotificaciones
      summary: Bandeja de avisos de la cuenta (coincidencias y reclamaciones)
      tags: [Notificaciones]
      security:
        - sesion: []
      responses:
        "200":
          description: Los 50 avisos más recientes y cuántos no se han leído
          content:
            application/json:
              schema:
                type: object
                required: [noLeidas, notificaciones]
                properties:
                  noLeidas:
                    type: integer
                  notificaciones:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notificacion"
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notificaciones/leidas:
    post:
      operationId: marcarTodasLeidas
      summary: Marcar todos los avisos como leídos
      tags: [Notificaciones]
      security:
        - sesion: []
      responses:
        "204":
          description: Hecho
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notificaciones/{id}/leida:
    post:
      operationId: marcarLeida
      summary: Marcar un aviso propio como leído
      tags: [Notificaciones]
      security:
        - sesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Hecho
        "401":
          description: Falta la sesión o no es válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No existe o no es de esta cuenta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /coincidencias:
    get:
      operationId: listarCoincidencias
      summary: Consultar coincidencias detectadas para una publicación
      tags: [Emparejamiento]
      parameters:
        - name: publicacionId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Lista de coincidencias (vacía si no hay o si no se envía publicacionId)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coincidencia"
components:
  securitySchemes:
    sesion:
      type: http
      scheme: bearer
      description: Token opaco devuelto por POST /sesiones (ADR-0013)
  schemas:
    LugarCampus:
      type: object
      required: [nombre, niveles]
      properties:
        nombre:
          type: string
          example: Bloque A1
        niveles:
          type: array
          description: Pisos que se ofrecen como submenú; vacío si el lugar no tiene
          items:
            type: string
          example: [Piso 1, Piso 2, Piso 3, Piso 4]
    Notificacion:
      type: object
      required: [id, cuentaId, tipo, titulo, mensaje, publicacionId, leida, creadoEn]
      properties:
        id:
          type: string
        cuentaId:
          type: string
        tipo:
          type: string
          enum: [coincidencia, reclamacion_nueva, reclamacion_aprobada, reclamacion_rechazada, publicacion_ocultada]
        titulo:
          type: string
        mensaje:
          type: string
        publicacionId:
          type: string
          description: Publicación a la que lleva el aviso
        leida:
          type: boolean
        creadoEn:
          type: string
          format: date-time
    AvisoPrivacidad:
      type: object
      required: [version, titulo, secciones]
      properties:
        version:
          type: string
          example: "2026-10-18"
        titulo:
          type: string
        secciones:
          type: array
          items:
            type: object
            required: [titulo, texto]
            properties:
              titulo:
                type: string
              texto:
                type: string
    DatosPersonales:
      type: object
      required: [generadoEn, cuenta, publicaciones, reclamaciones, avisos]
      properties:
        generadoEn:
          type: string
          format: date-time
        cuenta:
          type: object
          required: [id, correo, nombre, creadoEn]
          properties:
            id:
              type: string
            correo:
              type: string
            nombre:
              type: string
            creadoEn:
              type: string
              format: date-time
            avisoDePrivacidadAceptadoEn:
              type: string
              format: date-time
              nullable: true
            versionDelAviso:
              type: string
              nullable: true
        publicaciones:
          type: array
          items:
            $ref: "#/components/schemas/Publicacion"
        reclamaciones:
          type: array
          items:
            $ref: "#/components/schemas/Reclamacion"
        avisos:
          type: array
          items:
            $ref: "#/components/schemas/Notificacion"
        reportes:
          type: array
          description: Los reportes de publicaciones que hizo la cuenta
          items:
            $ref: "#/components/schemas/Reporte"
    Cuenta:
      type: object
      required: [id, correo, nombre]
      properties:
        id:
          type: string
        correo:
          type: string
        nombre:
          type: string
        esAdministrador:
          type: boolean
          description: Solo en `POST /sesiones` y `GET /cuentas/yo`; true si el correo está en la lista de administradores
    Reporte:
      type: object
      required: [id, publicacionId, reportanteId, motivo, estado, creadoEn]
      properties:
        id:
          type: string
        publicacionId:
          type: string
        reportanteId:
          type: string
        motivo:
          type: string
          enum: [falso, spam, inapropiado, datos_personales, otro]
        detalle:
          type: string
          nullable: true
        estado:
          type: string
          enum: [abierto, ocultada, descartado]
        creadoEn:
          type: string
          format: date-time
        resueltoEn:
          type: string
          format: date-time
          nullable: true
        resueltoPor:
          type: string
          nullable: true
        nota:
          type: string
          nullable: true
    ReporteParaModerar:
      type: object
      required: [reporte, publicacion, reportesDeLaPublicacion]
      properties:
        reporte:
          $ref: "#/components/schemas/Reporte"
        publicacion:
          type: object
          nullable: true
          properties:
            id:
              type: string
            tipo:
              $ref: "#/components/schemas/TipoPublicacion"
            descripcion:
              type: string
            categoria:
              type: string
            ubicacion:
              type: string
            estado:
              type: string
        reportesDeLaPublicacion:
          type: integer
    Reclamacion:
      type: object
      required: [id, publicacionId, reclamanteId, prueba, estado, creadoEn]
      properties:
        id:
          type: string
        publicacionId:
          type: string
        reclamanteId:
          type: string
        prueba:
          type: string
        estado:
          type: string
          enum: [pendiente, aprobada, rechazada]
        creadoEn:
          type: string
          format: date-time
        resueltaEn:
          type: string
          format: date-time
          nullable: true
        entregadaEn:
          type: string
          format: date-time
          nullable: true
        motivoRechazo:
          type: string
          nullable: true
    ReclamacionParaAutor:
      type: object
      required: [id, publicacionId, estado, prueba, creadoEn, reclamante]
      properties:
        id:
          type: string
        publicacionId:
          type: string
        estado:
          type: string
          enum: [pendiente, aprobada, rechazada]
        prueba:
          type: string
        creadoEn:
          type: string
          format: date-time
        resueltaEn:
          type: string
          format: date-time
          nullable: true
        entregadaEn:
          type: string
          format: date-time
          nullable: true
        motivoRechazo:
          type: string
          nullable: true
        reclamante:
          type: object
          required: [nombre]
          properties:
            nombre:
              type: string
            correo:
              type: string
              description: Solo cuando la reclamación está aprobada
    ReclamacionPropia:
      type: object
      required: [id, publicacionId, estado, creadoEn]
      properties:
        id:
          type: string
        publicacionId:
          type: string
        estado:
          type: string
          enum: [pendiente, aprobada, rechazada]
        creadoEn:
          type: string
          format: date-time
        resueltaEn:
          type: string
          format: date-time
          nullable: true
        entregadaEn:
          type: string
          format: date-time
          nullable: true
        motivoRechazo:
          type: string
          nullable: true
        contactoQuienEncontro:
          type: object
          description: Solo cuando la reclamación está aprobada
          required: [nombre, correo]
          properties:
            nombre:
              type: string
            correo:
              type: string
    Disponibilidad:
      type: object
      required: [status, service, almacenamiento]
      properties:
        status:
          type: string
          enum: [ok, degradado]
        service:
          type: string
          example: recobra-backend
        almacenamiento:
          type: string
          description: Almacenamiento que respalda el servicio
          enum: [memoria, postgres]
    Salud:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: recobra-backend
    TipoPublicacion:
      type: string
      enum: [perdido, encontrado]
    CrearPublicacionRequest:
      type: object
      required: [tipo, descripcion, categoria, ubicacion]
      properties:
        tipo:
          $ref: "#/components/schemas/TipoPublicacion"
        descripcion:
          type: string
          minLength: 1
        categoria:
          type: string
          minLength: 1
        ubicacion:
          type: string
          minLength: 1
          description: Lugar del campus (edificio o zona); se usa para filtrar y emparejar
        detalleUbicacion:
          type: string
          nullable: true
          maxLength: 120
          description: Piso, salón o punto de referencia dentro del lugar (opcional)
          example: "Piso 2 · Salón 204"
        custodia:
          type: string
          nullable: true
          enum: [quien_lo_encontro, punto_de_entrega, null]
          description: Solo encontrados; dónde está el objeto ahora (ADR-0019). Por omisión, quien_lo_encontro
        puntoCustodia:
          type: string
          nullable: true
          maxLength: 120
          description: Con custodia punto_de_entrega, el lugar donde quedó (portería, oficina…)
    Publicacion:
      type: object
      required: [id, tipo, descripcion, categoria, ubicacion, estado, creadoEn]
      properties:
        id:
          type: string
        tipo:
          $ref: "#/components/schemas/TipoPublicacion"
        descripcion:
          type: string
        categoria:
          type: string
        ubicacion:
          type: string
        detalleUbicacion:
          type: string
          nullable: true
          description: Piso, salón o referencia; null si no se indicó
        estado:
          type: string
          enum: [publicado, en_verificacion, por_entregar, reclamado, cerrado]
          description: "reclamado: entregado a su dueño (ADR-0017)"
        motivoCierre:
          type: string
          nullable: true
          enum: [recuperado, retirado, vencido, moderado, null]
        custodia:
          type: string
          nullable: true
          enum: [quien_lo_encontro, punto_de_entrega, null]
          description: Solo encontrados; dónde está el objeto ahora (ADR-0019). Por omisión, quien_lo_encontro
        puntoCustodia:
          type: string
          nullable: true
          maxLength: 120
          description: Con custodia punto_de_entrega, el lugar donde quedó (portería, oficina…)
        cerradoEn:
          type: string
          format: date-time
          nullable: true
        creadoEn:
          type: string
          format: date-time
        autorId:
          type: string
          nullable: true
          description: Cuenta que publicó; null en publicaciones anteriores a las cuentas
        tieneFoto:
          type: boolean
          description: Si tiene foto (ADR-0023). La miniatura es pública en `/publicaciones/{id}/foto/miniatura`
    Error:
      description: Formato único de error para 400, 401, 403, 404, 409, 422, 500 y 503.
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          type: string
          example: "tipo debe ser uno de: perdido, encontrado"
    Coincidencia:
      type: object
      required: [id, publicacionOrigenId, publicacionCoincidenteId, score, estado, creadoEn]
      properties:
        id:
          type: string
        publicacionOrigenId:
          type: string
        publicacionCoincidenteId:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 1
        estado:
          type: string
          enum: [detectada]
        creadoEn:
          type: string
          format: date-time

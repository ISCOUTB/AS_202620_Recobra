name: recobra_mobile
description: Cliente Flutter de Recobra — crear y consultar publicaciones.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  image: ^4.12.0
  image_picker: ^1.2.4
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Roboto va dentro de la app (licencia Apache 2.0 en assets/fonts/LICENSE-Roboto.txt):
  # sin esto, la versión web la descarga de fonts.gstatic.com al abrir, lo que le
  # cuenta a Google quién usa Recobra y rompe con la política de contenido (CSP)
  # que solo permite conexiones al propio sitio (ADR-0029, amenaza T27).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

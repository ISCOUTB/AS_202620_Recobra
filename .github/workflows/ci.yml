name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend NestJS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: E2E tests
        run: npm run test:e2e
      - name: Build
        run: npm run build

  mobile:
    name: Flutter client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test

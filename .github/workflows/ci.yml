name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend NestJS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Contract tests (OpenAPI, docs/contracts/openapi.yaml)
        run: npm run test:contract
      - name: E2E tests
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - name: Docker build (valida Dockerfile, evidencia S8)
        run: docker build -t recobra-backend-ci .

  postgres:
    name: Adaptadores contra PostgreSQL real
    # ADR-0027: la consistencia (crear sin duplicar, comparar y fijar, unicidad) se
    # apoya en el motor, y las pruebas e2e del trabajo anterior corren contra los
    # adaptadores en memoria. Este trabajo ejecuta las mismas propiedades contra un
    # PostgreSQL de verdad, para que un cambio de SQL o de motor falle aquí y no en
    # producción. La imagen va fijada por su digest; el servicio es efimero y local
    # al trabajo, sin contrasena (trust), asi que no hay secreto que guardar.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: recobra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recobra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL_PRUEBAS: postgresql://postgres@localhost:5432/recobra_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Puertos de persistencia contra PostgreSQL
        run: npm run test:e2e -- test/adaptadores.e2e-spec.ts --forceExit
      # Evidencia de restauración (docs/despliegue/respaldos.md): con los datos que dejó
      # la suite anterior, se hace un respaldo, se restaura en otra base y se compara
      # cada tabla (filas y huella del contenido, incluidos los bytes de las fotos). Las
      # herramientas son las de la misma imagen de PostgreSQL, así coincide la versión.
      - name: Respaldo y restauración verificados
        env:
          PGHOST: localhost
          PGUSER: postgres
          BASE_ORIGEN: recobra_test
        run: docker run --rm --network host -e PGHOST -e PGUSER -e BASE_ORIGEN -v "$PWD/scripts:/scripts:ro" postgres:16@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690 bash /scripts/verificar-respaldo-postgres.sh

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo para el periodo de codigo nuevo
      # SONAR_TOKEN existe, pero el token es personal y SonarCloud responde
      # "Not authorized or project not found" al crear el análisis: falta el
      # permiso Execute Analysis sobre el proyecto de la organización isco-utb
      # (ver docs/no-conformidades.md, punto 4). Mientras tanto el paso no
      # bloquea el pipeline; el Quality Gate público sigue corriendo por la
      # GitHub App.
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  quality-gate:
    name: Quality Gate (SonarCloud)
    # Bloqueante: falla el pipeline si el Quality Gate público de SonarCloud no
    # aprueba ESTE commit. No usa token (API de lectura pública), así que
    # funciona aunque el scanner con SONAR_TOKEN no tenga permiso todavía.
    # Solo en push: en pull_request el SHA es un commit de fusión que
    # SonarCloud no analiza.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Esperar el análisis del commit y exigir Quality Gate aprobado
        run: node scripts/verificar-quality-gate.js

  mobile:
    name: Flutter client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test

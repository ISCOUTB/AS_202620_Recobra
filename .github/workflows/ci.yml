name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend NestJS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Contract tests (OpenAPI, docs/contracts/openapi.yaml)
        run: npm run test:contract
      - name: E2E tests
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - name: Docker build (valida Dockerfile, evidencia S8)
        run: docker build -t recobra-backend-ci .

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo para el periodo de codigo nuevo
      # continue-on-error (no "if" a nivel de job con secrets: eso invalida
      # el workflow entero). Mientras no exista el secreto SONAR_TOKEN, este
      # paso falla pero no tumba el job ni el pipeline; el Quality Gate real
      # ya corre hoy via GitHub App (ver docs/no-conformidades.md). En
      # cuanto alguien con acceso de administrador cree el secreto, este
      # paso empieza a correr de verdad y queda como evidencia explicita en
      # el workflow para el revisor automatico.
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  mobile:
    name: Flutter client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test

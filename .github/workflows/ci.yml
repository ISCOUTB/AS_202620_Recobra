name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# Permisos mínimos (amenaza T17, ADR-0030): el flujo solo lee el repositorio. Ningún trabajo
# necesita escribir, publicar paquetes ni comentar en solicitudes de cambio.
permissions:
  contents: read

jobs:
  backend:
    name: Backend NestJS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Documentación (enlaces, ADR y arc42 §9)
        run: node scripts/verificar-documentacion.js
      - name: Unit tests (incluye las reglas de la arquitectura hexagonal, src/arquitectura.spec.ts)
        run: npm test
      - name: Contract tests (OpenAPI, docs/contracts/openapi.yaml)
        run: npm run test:contract
      - name: E2E tests
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - name: Docker build (valida Dockerfile, evidencia S8)
        run: docker build -t recobra-backend-ci .
      - name: La imagen no arranca en producción sin base de datos (corte final)
        # Sin DATABASE_URL, la imagen (NODE_ENV=production) debe detenerse con
        # error en vez de atender en memoria. Si siguiera viva a los 30 s, fallar.
        run: |
          set +e
          timeout 30 docker run --rm recobra-backend-ci > arranque.log 2>&1
          codigo=$?
          cat arranque.log
          if [ "$codigo" -eq 124 ]; then echo 'Arrancó sin base de datos'; exit 1; fi
          grep -q 'Producción sin DATABASE_URL' arranque.log

  postgres:
    name: Adaptadores contra PostgreSQL real
    # ADR-0027: la consistencia (crear sin duplicar, comparar y fijar, unicidad) se
    # apoya en el motor, y las pruebas e2e del trabajo anterior corren contra los
    # adaptadores en memoria. Este trabajo ejecuta las mismas propiedades contra un
    # PostgreSQL de verdad, para que un cambio de SQL o de motor falle aquí y no en
    # producción. La imagen va fijada por su digest; el servicio es efimero y local
    # al trabajo, sin contrasena (trust), asi que no hay secreto que guardar.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: recobra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recobra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL_PRUEBAS: postgresql://postgres@localhost:5432/recobra_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Puertos de persistencia contra PostgreSQL
        run: npm run test:e2e -- test/adaptadores.e2e-spec.ts --forceExit
      # Evidencia de restauración (docs/despliegue/respaldos.md): con los datos que dejó
      # la suite anterior, se hace un respaldo, se restaura en otra base y se compara
      # cada tabla (filas y huella del contenido, incluidos los bytes de las fotos). Las
      # herramientas son las de la misma imagen de PostgreSQL, así coincide la versión.
      - name: Respaldo y restauración verificados
        env:
          PGHOST: localhost
          PGUSER: postgres
          BASE_ORIGEN: recobra_test
        run: docker run --rm --network host -e PGHOST -e PGUSER -e BASE_ORIGEN -v "$PWD/scripts:/scripts:ro" postgres:16@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690 bash /scripts/verificar-respaldo-postgres.sh

  seguridad:
    name: Seguridad (dependencias y secretos)
    # ADR-0030, docs/seguridad/: (1) análisis de dependencias con decisiones revisadas: falla si aparece
    # un aviso de seguridad que no esté en docs/seguridad/hallazgos-dependencias.json o si una decisión
    # venció (npm audit de producción + OSV para la app Flutter); (2) barrido de secretos de todo el
    # historial (el repositorio es público: quitar un secreto del último commit no lo quita del historial).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # el barrido necesita todo el historial
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Análisis de dependencias (producción y Flutter)
        run: node scripts/revisar-dependencias.js
      - name: Barrido de secretos (árbol e historial)
        run: node scripts/barrido-secretos.js

  sonarcloud:
    name: SonarCloud Scan (sin permiso; no bloquea)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo para el periodo de codigo nuevo
      # SONAR_TOKEN existe, pero SonarCloud responde "Not authorized or project not
      # found": la cuenta del token no tiene el permiso Execute Analysis sobre el
      # proyecto de la organizacion isco-utb, y solo un administrador de esa
      # organizacion puede darlo (docs/no-conformidades.md, punto 4). El paso no
      # bloquea, pero su falla ya no queda escondida en verde: el paso siguiente
      # deja una advertencia visible en el run (observacion S16). Lo que bloquea es
      # el job Quality Gate, con el analisis automatico de SonarCloud.
      - name: SonarCloud Scan
        id: scanner
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Avisar si el scanner fallo
        if: steps.scanner.outcome == 'failure'
        run: echo "::warning title=SonarCloud Scan fallo::El scanner con SONAR_TOKEN fallo (falta el permiso Execute Analysis en isco-utb). No es un analisis exitoso; el Quality Gate se verifica en el job Quality Gate con el analisis automatico."

  quality-gate:
    name: Quality Gate (SonarCloud)
    # Bloqueante: falla el pipeline si el Quality Gate público de SonarCloud no
    # aprueba ESTE commit. No usa token (API de lectura pública), así que
    # funciona aunque el scanner con SONAR_TOKEN no tenga permiso todavía.
    # Solo en push: en pull_request el SHA es un commit de fusión que
    # SonarCloud no analiza.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Esperar el análisis del commit y exigir Quality Gate aprobado
        run: node scripts/verificar-quality-gate.js

  mobile:
    name: Flutter client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test

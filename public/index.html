<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recobra — Objetos perdidos y encontrados</title>
<style>
  /* Paleta tomada de la web institucional de la UTB (utb.edu.co); validar
     contra el manual de identidad antes de la entrega final. */
  :root {
    --azul: #093ad8;
    --azul-oscuro: #15295a;
    --celeste: #6ec1e4;
    --fondo: #f5f7fb;
    --superficie: #ffffff;
    --borde: #d8deea;
    --texto: #1b2437;
    --texto-suave: #4b5670;
    --perdido-fondo: #fef0c7;
    --perdido-texto: #93370d;
    --encontrado-fondo: #d1fadf;
    --encontrado-texto: #05603a;
    --error: #b42318;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
  }

  header {
    background: var(--azul-oscuro);
    color: #ffffff;
    border-bottom: 4px solid var(--celeste);
  }

  .contenedor {
    max-width: 1040px;
    margin: 0 auto;
    padding: 0 1.25rem;
  }

  .cabecera {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    padding-top: 1.5rem;
    padding-bottom: 1.5rem;
  }

  header h1 { margin: 0; font-size: 1.9rem; letter-spacing: 0.01em; }
  header p { margin: 0.15rem 0 0; color: #c9d6f5; font-size: 0.95rem; }

  #estado-salud {
    display: inline-block;
    padding: 0.3rem 0.85rem;
    border-radius: 999px;
    font-size: 0.82rem;
    border: 1px solid #5d75b8;
    color: #dbe4fb;
  }
  #estado-salud.ok { border-color: #6ce9a6; color: #6ce9a6; }
  #estado-salud.error { border-color: #fda29b; color: #fda29b; }

  #boton-reintentar[hidden] { display: none; }
  #boton-reintentar {
    margin-left: 0.5rem;
    padding: 0.3rem 0.85rem;
    border-radius: 999px;
    border: 1px solid #fda29b;
    background: transparent;
    color: #fda29b;
    font: inherit;
    font-size: 0.82rem;
    cursor: pointer;
  }

  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 1.75rem 1.25rem 4rem;
    display: grid;
    grid-template-columns: minmax(0, 360px) minmax(0, 1fr);
    gap: 1.75rem;
    align-items: start;
  }

  @media (max-width: 800px) {
    main { grid-template-columns: minmax(0, 1fr); }
  }

  .panel {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 1.25rem;
    box-shadow: 0 1px 2px rgba(21, 41, 90, 0.06);
  }

  .panel h2 { margin: 0 0 1rem; font-size: 1.15rem; color: var(--azul-oscuro); }

  form { display: flex; flex-direction: column; gap: 0.85rem; }

  label {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--texto-suave);
  }

  input, select {
    font: inherit;
    font-weight: 400;
    padding: 0.6rem 0.7rem;
    border: 1px solid var(--borde);
    border-radius: 8px;
    background: #ffffff;
    color: var(--texto);
  }

  input:focus-visible, select:focus-visible, button:focus-visible, .zona-foto:focus-visible {
    outline: 3px solid var(--celeste);
    outline-offset: 1px;
  }

  button {
    font: inherit;
    font-weight: 600;
    padding: 0.7rem 1rem;
    border-radius: 8px;
    border: 1px solid var(--azul);
    background: var(--azul);
    color: #ffffff;
    cursor: pointer;
  }
  button:hover { background: #0a31b3; }
  button.secundario {
    background: transparent;
    color: var(--azul);
    padding: 0.4rem 0.8rem;
    font-size: 0.85rem;
  }
  button.secundario:hover { background: #eaf0ff; }

  #mensaje-crear { display: block; margin: 0; font-size: 0.88rem; min-height: 1.2em; }
  #mensaje-crear.error { color: var(--error); }
  #mensaje-crear.ok { color: var(--encontrado-texto); }

  .zona-foto {
    width: 100%;
    font: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 1.1rem 1rem;
    border: 1px dashed #9aa8c7;
    border-radius: 8px;
    background: #fafbff;
    cursor: pointer;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 400;
    color: var(--texto-suave);
  }
  .zona-foto:hover { border-color: var(--azul); background: #eef2ff; }
  #vista-previa-foto { max-width: 100%; max-height: 130px; border-radius: 6px; }

  .filtros {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  @media (max-width: 560px) {
    .filtros { grid-template-columns: minmax(0, 1fr); }
  }

  #resumen {
    display: block;
    margin: 0 0 0.9rem;
    font-size: 0.88rem;
    color: var(--texto-suave);
  }

  .tarjeta {
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    background: #ffffff;
    margin-bottom: 0.75rem;
  }

  .tarjeta .fila-superior {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.4rem;
  }

  .etiqueta-tipo {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .etiqueta-tipo.perdido { background: var(--perdido-fondo); color: var(--perdido-texto); }
  .etiqueta-tipo.encontrado { background: var(--encontrado-fondo); color: var(--encontrado-texto); }

  .tarjeta .descripcion { font-size: 1.05rem; font-weight: 600; }
  .tarjeta .meta { font-size: 0.82rem; color: var(--texto-suave); margin-top: 0.25rem; }
  .tarjeta .acciones { margin-top: 0.6rem; }

  .coincidencias { margin: 0.6rem 0 0; padding: 0.6rem 0.8rem; background: #eef4ff; border-radius: 8px; font-size: 0.88rem; }
  .coincidencias ul { margin: 0.3rem 0 0; padding-left: 1.1rem; }

  .vacio {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--texto-suave);
    border: 1px dashed var(--borde);
    border-radius: 10px;
  }
</style>
</head>
<body>

<header>
  <div class="contenedor cabecera">
    <div>
      <h1>Recobra</h1>
      <p>Objetos perdidos y encontrados en el campus</p>
    </div>
    <div>
      <output id="estado-salud">verificando backend…</output>
      <button id="boton-reintentar" type="button" hidden>Reintentar</button>
    </div>
  </div>
</header>

<main>
  <section class="panel" aria-labelledby="titulo-crear">
    <h2 id="titulo-crear">Publicar un objeto</h2>
    <form id="form-crear">
      <label>Tipo
        <select name="tipo" required>
          <option value="perdido">Perdido</option>
          <option value="encontrado">Encontrado</option>
        </select>
      </label>
      <label>Descripción
        <input type="text" name="descripcion" placeholder="Mochila azul con laptop" required />
      </label>
      <label>Categoría
        <select name="categoria" required>
          <option value="">Selecciona una categoría</option>
          <option value="electronica">Electrónica</option>
          <option value="mochilas">Mochilas y bolsos</option>
          <option value="documentos">Documentos e identificación</option>
          <option value="llaves">Llaves</option>
          <option value="ropa">Ropa y accesorios</option>
          <option value="utiles">Útiles y libros</option>
          <option value="otros">Otros</option>
        </select>
      </label>
      <label>Ubicación
        <input type="text" name="ubicacion" placeholder="Bloque 5, UTB" required />
      </label>
      <label>Foto (opcional, solo vista previa por ahora)
        <button type="button" class="zona-foto" id="zona-foto">
          <img id="vista-previa-foto" alt="Vista previa" hidden />
          <span id="texto-zona-foto">Elegir una foto del objeto</span>
        </button>
        <input type="file" id="input-foto" accept="image/*" hidden />
      </label>
      <button type="submit">Publicar</button>
      <output id="mensaje-crear"></output>
    </form>
  </section>

  <section class="panel" aria-labelledby="titulo-buscar">
    <h2 id="titulo-buscar">Buscar publicaciones</h2>
    <div class="filtros">
      <label>Tipo
        <select id="filtro-tipo">
          <option value="">Todos</option>
          <option value="perdido">Perdido</option>
          <option value="encontrado">Encontrado</option>
        </select>
      </label>
      <label>Categoría
        <select id="filtro-categoria">
          <option value="">Todas</option>
          <option value="electronica">Electrónica</option>
          <option value="mochilas">Mochilas y bolsos</option>
          <option value="documentos">Documentos e identificación</option>
          <option value="llaves">Llaves</option>
          <option value="ropa">Ropa y accesorios</option>
          <option value="utiles">Útiles y libros</option>
          <option value="otros">Otros</option>
        </select>
      </label>
      <label>Ubicación
        <input type="text" id="filtro-ubicacion" placeholder="Bloque 5, UTB" />
      </label>
    </div>
    <output id="resumen"></output>
    <div id="lista-publicaciones"></div>
  </section>
</main>

<script>
  const estadoSalud = document.getElementById('estado-salud');
  const botonReintentar = document.getElementById('boton-reintentar');
  const formCrear = document.getElementById('form-crear');
  const mensajeCrear = document.getElementById('mensaje-crear');
  const listaPublicaciones = document.getElementById('lista-publicaciones');
  const resumen = document.getElementById('resumen');
  const zonaFoto = document.getElementById('zona-foto');
  const inputFoto = document.getElementById('input-foto');
  const vistaPreviaFoto = document.getElementById('vista-previa-foto');
  const textoZonaFoto = document.getElementById('texto-zona-foto');
  const filtroTipo = document.getElementById('filtro-tipo');
  const filtroCategoria = document.getElementById('filtro-categoria');
  const filtroUbicacion = document.getElementById('filtro-ubicacion');

  const TEXTO_FOTO = 'Elegir una foto del objeto';

  zonaFoto.addEventListener('click', () => inputFoto.click());

  inputFoto.addEventListener('change', () => {
    const archivo = inputFoto.files[0];
    if (!archivo) return;
    textoZonaFoto.textContent = archivo.name;
    const lector = new FileReader();
    lector.onload = () => {
      vistaPreviaFoto.src = lector.result;
      vistaPreviaFoto.hidden = false;
    };
    lector.readAsDataURL(archivo);
  });

  /**
   * El plan Free de Render (ADR-0005) "duerme" el servicio tras
   * inactividad: la primera petición tras despertar puede tardar decenas
   * de segundos. Reintenta durante ~80 s antes de darlo por caído y deja un
   * botón manual como último recurso. Al quedar en línea carga la lista
   * desde el servidor (GET /publicaciones), así lo publicado no depende de
   * la sesión del navegador.
   */
  async function verificarSalud(intento = 1, ultimoMotivo = '') {
    const maxIntentos = 20;
    botonReintentar.hidden = true;
    const sufijoMotivo = ultimoMotivo ? ` · ${ultimoMotivo}` : '';
    estadoSalud.textContent =
      intento === 1
        ? 'verificando backend…'
        : `despertando el backend… (intento ${intento}/${maxIntentos}${sufijoMotivo})`;
    estadoSalud.className = '';
    let motivo = 'error de red';
    try {
      const controlador = new AbortController();
      const timeout = setTimeout(() => controlador.abort(), 8000);
      const respuesta = await fetch('/health', { signal: controlador.signal, cache: 'no-store' });
      clearTimeout(timeout);
      if (!respuesta.ok) {
        motivo = `HTTP ${respuesta.status}`;
        throw new Error(motivo);
      }
      estadoSalud.textContent = 'backend en línea';
      estadoSalud.className = 'ok';
      buscar();
    } catch (error) {
      if (error.name === 'AbortError') motivo = 'sin respuesta en 8 s';
      estadoSalud.title = `Último intento: ${motivo}`;
      console.warn(`Recobra: /health falló (${motivo}), intento ${intento}/${maxIntentos}`);
      if (intento < maxIntentos) {
        setTimeout(() => verificarSalud(intento + 1, motivo), 4000);
        return;
      }
      estadoSalud.textContent = 'no se pudo contactar al backend';
      estadoSalud.className = 'error';
      botonReintentar.hidden = false;
    }
  }

  botonReintentar.addEventListener('click', () => verificarSalud(1));

  function elemento(etiqueta, clase, texto) {
    const nodo = document.createElement(etiqueta);
    if (clase) nodo.className = clase;
    if (texto !== undefined) nodo.textContent = texto;
    return nodo;
  }

  function formatearFecha(iso) {
    const fecha = new Date(iso);
    if (Number.isNaN(fecha.getTime())) return '';
    return fecha.toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' });
  }

  async function verCoincidencias(pub, contenedor, boton) {
    boton.disabled = true;
    contenedor.replaceChildren();
    try {
      const respuesta = await fetch(`/coincidencias?publicacionId=${encodeURIComponent(pub.id)}`);
      const coincidencias = await respuesta.json();
      const caja = elemento('div', 'coincidencias');
      if (!Array.isArray(coincidencias) || coincidencias.length === 0) {
        caja.textContent = 'Sin coincidencias por ahora.';
      } else {
        caja.append(elemento('strong', '', `${coincidencias.length} posible(s) coincidencia(s)`));
        const lista = document.createElement('ul');
        for (const c of coincidencias) {
          const otroId = c.publicacionOrigenId === pub.id ? c.publicacionCoincidenteId : c.publicacionOrigenId;
          const item = elemento('li', '', 'Cargando…');
          lista.append(item);
          fetch(`/publicaciones/${encodeURIComponent(otroId)}`)
            .then((r) => r.json())
            .then((otra) => {
              item.textContent = `${otra.descripcion} (${otra.tipo}, ${otra.ubicacion})`;
            })
            .catch(() => {
              item.textContent = 'No se pudo cargar la publicación coincidente.';
            });
        }
        caja.append(lista);
      }
      contenedor.append(caja);
    } catch {
      contenedor.append(elemento('div', 'coincidencias', 'No se pudieron consultar las coincidencias.'));
    } finally {
      boton.disabled = false;
    }
  }

  function tarjetaPublicacion(pub) {
    const tarjeta = elemento('div', 'tarjeta');
    const fila = elemento('div', 'fila-superior');
    fila.append(elemento('span', `etiqueta-tipo ${pub.tipo}`, pub.tipo), elemento('span', 'meta', pub.estado));
    const meta = elemento('div', 'meta', `${pub.categoria} · ${pub.ubicacion} · ${formatearFecha(pub.creadoEn)}`);
    const acciones = elemento('div', 'acciones');
    const boton = elemento('button', 'secundario', 'Ver coincidencias');
    boton.type = 'button';
    const resultado = elemento('div');
    boton.addEventListener('click', () => verCoincidencias(pub, resultado, boton));
    acciones.append(boton);
    tarjeta.append(fila, elemento('div', 'descripcion', pub.descripcion), meta, acciones, resultado);
    return tarjeta;
  }

  let temporizadorBusqueda;
  async function buscar() {
    const parametros = new URLSearchParams({ limite: '20' });
    if (filtroTipo.value) parametros.set('tipo', filtroTipo.value);
    if (filtroCategoria.value) parametros.set('categoria', filtroCategoria.value);
    if (filtroUbicacion.value.trim()) parametros.set('ubicacion', filtroUbicacion.value.trim());
    const hayFiltros = [...parametros].length > 1;
    try {
      const respuesta = await fetch(`/publicaciones?${parametros}`);
      const publicaciones = await respuesta.json();
      if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
      listaPublicaciones.replaceChildren();
      if (publicaciones.length === 0) {
        listaPublicaciones.append(
          elemento('div', 'vacio', hayFiltros ? 'No hay publicaciones con esos filtros.' : 'Todavía no hay publicaciones.'),
        );
        resumen.textContent = '';
        return;
      }
      resumen.textContent = hayFiltros
        ? `${publicaciones.length} resultado(s), los más recientes primero.`
        : `Las ${publicaciones.length} publicaciones más recientes.`;
      for (const pub of publicaciones) listaPublicaciones.append(tarjetaPublicacion(pub));
    } catch {
      resumen.textContent = 'No se pudo cargar la lista. Intenta de nuevo en unos segundos.';
    }
  }

  function buscarConRetraso() {
    clearTimeout(temporizadorBusqueda);
    temporizadorBusqueda = setTimeout(buscar, 300);
  }

  filtroTipo.addEventListener('change', buscar);
  filtroCategoria.addEventListener('change', buscar);
  filtroUbicacion.addEventListener('input', buscarConRetraso);

  formCrear.addEventListener('submit', async (evento) => {
    evento.preventDefault();
    mensajeCrear.textContent = '';
    mensajeCrear.className = '';

    const datos = Object.fromEntries(new FormData(formCrear).entries());

    try {
      const respuesta = await fetch('/publicaciones', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos),
      });
      const cuerpo = await respuesta.json();

      if (!respuesta.ok) {
        mensajeCrear.textContent = cuerpo.message || 'No se pudo publicar.';
        mensajeCrear.className = 'error';
        return;
      }

      mensajeCrear.textContent = 'Publicación creada.';
      mensajeCrear.className = 'ok';
      formCrear.reset();
      inputFoto.value = '';
      vistaPreviaFoto.hidden = true;
      vistaPreviaFoto.src = '';
      textoZonaFoto.textContent = TEXTO_FOTO;
      buscar();
    } catch {
      mensajeCrear.textContent = 'No se pudo contactar al backend.';
      mensajeCrear.className = 'error';
    }
  });

  verificarSalud();
</script>

</body>
</html>

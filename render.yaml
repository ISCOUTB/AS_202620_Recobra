# RETIRADO como despliegue oficial (ADR-0010): hoy la API corre en Dokploy, ver
# deploy/compose.lab.yaml. Se conserva como referencia histórica de la
# evidencia S8 y como vía de reversión.
#
# Infraestructura como código (evidencia S8) — Render Blueprint.
# Render inyecta la variable de entorno PORT automáticamente; src/main.ts ya
# la lee (`process.env.PORT || 3000`), así que no se declara aquí como
# secreto ni como valor fijo (ver ADR de plataforma de despliegue).
services:
  - type: web
    name: recobra-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Sin valor aquí a propósito (sync: false): se define a mano en el
      # panel de Render, nunca en el repositorio (ver ADR-0006 y
      # docs/despliegue/costo-mensual.md). Sin esta variable, el backend
      # sigue funcionando con el adaptador en memoria (ver
      # src/publicaciones/publicaciones.module.ts).
      - key: DATABASE_URL
        sync: false
